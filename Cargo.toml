[package]
name = "canokey-pkcs11-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private synchronous libcanokey adapter for the C PKCS11 backend"

[lib]
path = "rust/lib.rs"
crate-type = ["staticlib"]

[dependencies]
canokey-c = { git = "https://github.com/canokeys/libcanokey", rev = "10808e1760bf5efa86b5ff2e0b4acbeaba441edc", default-features = false, features = ["piv"] }

[profile.release]
lto = "thin"
codegen-units = 16
# Catch ordinary Rust panics at the C boundary instead of aborting the host.
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
