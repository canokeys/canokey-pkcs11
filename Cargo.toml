[package]
name = "canokey-pkcs11-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private synchronous libcanokey adapter for the C PKCS11 backend"

[lib]
path = "rust/lib.rs"
crate-type = ["staticlib"]

[dependencies]
canokey-c = { git = "https://github.com/canokeys/libcanokey", rev = "fd341f6", default-features = false, features = ["piv"] }
canokey-protocol = { git = "https://github.com/canokeys/libcanokey", rev = "ef485008070a198ccb7c0ed17abd6d7a81dc9949", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 16
# Catch ordinary Rust panics at the C boundary instead of aborting the host.
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
